<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <title>ASTRA | Explore o Universo</title>
</head>

<body>
    <div class="ceu">
        <span class="estrela estrela1"></span>
        <span class="estrela estrela2"></span>
        <span class="estrela estrela3"></span>
        <span class="estrela estrela4"></span>
        <span class="estrela estrela5"></span>
    </div>

    <header>
        <h2 class="logo">✦ ASTRA</h2>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#planetas">Planetas</a>
            <a href="#descobertas">Descobertas</a>
            <a href="#sobre">Sobre</a>
        </nav>
    </header>

    <section class="apresentacao" id="inicio">
        <h1>Bem-vindo ao ASTRA!</h1>
        <p>Sua descoberta pelo universo começa aqui.</p>
    </section>

    <section class="planetas" id="planetas">
        <h2>Descobrir planetas</h2>

        <div class="lista-planetas">

            <div class="card-planeta">
                <img class="imagem-planeta terra" src="imagens/terra.png" alt="Planeta Terra">
                <h3>Terra</h3>
                <p>O terceiro planeta do Sistema Solar.</p>
            </div>

            <div class="card-planeta">

                <img class="imagem-planeta marte" src="imagens/marte.png" alt="Planeta Marte">

                <h3>Marte</h3>
                <p>Conhecido como o "planeta vermelho"</p>
            </div>
        </div>
    </section>


</body>

</html>
